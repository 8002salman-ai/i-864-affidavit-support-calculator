<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── MOBILE & DESKTOP READY ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="description" content="I-864 Affidavit of Support Calculator — USCIS 2024 poverty guidelines. Works offline, saves data locally on your device." />

    <!-- ── INSTALLABLE AS APP (iOS / Android) ── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="I-864 Calc" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ── App Icon (inline SVG so single-file works offline) ── -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234338ca'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EI8%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234338ca'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EI8%3C/text%3E%3C/svg%3E" />

    <title>I-864 Affidavit of Support Calculator | USCIS Sponsorship Tool</title>

    <style>
      /* Prevent overscroll bounce + better mobile feel */
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Respect notches / safe areas on phones */
      #root {
        padding-top: env(safe-area-inset-top, 0);
        padding-bottom: env(safe-area-inset-bottom, 0);
        padding-left: env(safe-area-inset-left, 0);
        padding-right: env(safe-area-inset-right, 0);
      }
      /* Loading splash (shown before React mounts) */
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #4338ca, #1d4ed8, #0284c7);
        color: #fff; font-family: system-ui, -apple-system, sans-serif; z-index: 9999;
        transition: opacity .4s ease;
      }
      #boot .logo {
        width: 64px; height: 64px; border-radius: 16px;
        background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 800; margin-bottom: 16px;
      }
      #boot .spin {
        margin-top: 18px; width: 28px; height: 28px;
        border: 3px solid rgba(255,255,255,.3); border-top-color: #fff;
        border-radius: 50%; animation: sp 0.8s linear infinite;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Boot splash removed automatically once app loads -->
    <div id="boot">
      <div class="logo">I-864</div>
      <div style="font-size:18px;font-weight:700;">Affidavit of Support Calculator</div>
      <div style="font-size:12px;opacity:.8;margin-top:4px;">Loading · Works Offline · Saves Locally</div>
      <div class="spin"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
